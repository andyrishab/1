<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Master Data Submenu</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-layout">
    /* Ensure the body takes full height and has a clean background */
    body {
      background-color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Card shadow and border styling to match image */
    .menu-card {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      border: 1px solid #e5e7eb;
    }

    /* Footer border-top accent */
    .footer-accent {
      border-top: 2px solid #b91c1c; /* red-700 equivalent */
    }
  </style>
</head>
<body>
<!-- BEGIN: MainHeader -->
<header class="bg-[#b91c1c] text-white flex items-center px-4 py-3 shadow-md">
<!-- Back arrow icon -->
<button class="p-2" data-purpose="back-button">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Title and Icon -->
<div class="flex-grow flex justify-center items-center gap-2 pr-10">
<h1 class="text-xl font-bold">Master</h1>
<div data-purpose="header-icon">
<svg class="h-6 w-6 text-white" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
</svg>
</div>
<h1 class="text-xl font-bold">Data</h1>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: ContentArea -->
<main class="flex-grow flex items-center justify-center p-6">
<div class="grid grid-cols-2 gap-4 w-full max-w-md">
<!-- Master Product Card -->
<a class="menu-card bg-white rounded flex flex-col items-center justify-center aspect-square p-4 text-center active:bg-gray-50 transition-colors" data-purpose="master-product-link" href="#">
<div class="mb-4" data-purpose="icon-container">
<!-- Illustration of box with clipboard -->
<svg class="w-24 h-24" fill="none" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<!-- Box -->
<path d="M50 20L85 35V65L50 80L15 65V35L50 20Z" stroke="#374151" stroke-linejoin="round" stroke-width="3"></path>
<path d="M15 35L50 50L85 35" stroke="#374151" stroke-linejoin="round" stroke-width="3"></path>
<path d="M50 50V80" stroke="#374151" stroke-linejoin="round" stroke-width="3"></path>
<!-- Clipboard overlay -->
<rect fill="white" height="30" rx="2" stroke="#b91c1c" stroke-width="2" width="25" x="25" y="55"></rect>
<rect fill="#b91c1c" height="6" rx="1" width="15" x="30" y="52"></rect>
<line stroke="#b91c1c" stroke-width="2" x1="30" x2="45" y1="65" y2="65"></line>
<line stroke="#b91c1c" stroke-width="2" x1="30" x2="45" y1="72" y2="72"></line>
<line stroke="#b91c1c" stroke-width="2" x1="30" x2="40" y1="79" y2="79"></line>
</svg>
</div>
<span class="text-gray-800 font-medium text-sm">Master Product</span>
</a>
<!-- Master Categories Card -->
<a class="menu-card bg-white rounded flex flex-col items-center justify-center aspect-square p-4 text-center active:bg-gray-50 transition-colors" data-purpose="master-categories-link" href="#">
<div class="mb-4" data-purpose="icon-container">
<!-- Illustration of box with nodes -->
<svg class="w-24 h-24" fill="none" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<!-- Open Box Bottom -->
<path d="M25 50V75L50 85L75 75V50" stroke="#374151" stroke-linejoin="round" stroke-width="3"></path>
<path d="M25 50L50 60L75 50" stroke="#374151" stroke-linejoin="round" stroke-width="3"></path>
<path d="M50 60V85" stroke="#374151" stroke-linejoin="round" stroke-width="3"></path>
<!-- Nodes branching out -->
<path d="M50 50V35" stroke="#b91c1c" stroke-width="2"></path>
<path d="M50 40H35V28" stroke="#b91c1c" stroke-width="2"></path>
<path d="M50 40H65V28" stroke="#b91c1c" stroke-width="2"></path>
<path d="M50 35V20" stroke="#b91c1c" stroke-width="2"></path>
<!-- Box symbols on nodes -->
<rect height="8" stroke="#b91c1c" stroke-width="2" width="10" x="30" y="20"></rect>
<rect height="8" stroke="#b91c1c" stroke-width="2" width="10" x="60" y="20"></rect>
<rect height="8" stroke="#b91c1c" stroke-width="2" width="10" x="45" y="12"></rect>
</svg>
</div>
<span class="text-gray-800 font-medium text-sm">Master Categories</span>
</a>
</div>
</main>
<!-- END: ContentArea -->
<!-- BEGIN: FooterBranding -->
<footer class="footer-accent bg-white py-2 px-4 flex items-center justify-center gap-2">
<span class="text-xs text-gray-600">powered by :</span>
<!-- STEM Logo Placeholder -->
<div class="flex items-center" data-purpose="company-logo">
<div class="font-bold text-blue-800 text-lg tracking-tight">STEM</div>
<div class="ml-1 flex flex-col leading-none">
<span class="text-[6px] uppercase tracking-widest text-gray-500">Innovation • Design • Value</span>
</div>
</div>
<!-- SAP Gold Partner Placeholder -->
<div class="ml-2 border-l border-gray-300 pl-2 flex items-center" data-purpose="partner-logo">
<div class="flex flex-col items-start leading-none">
<span class="text-[10px] font-bold text-blue-900">SAP</span>
<div class="bg-yellow-400 px-1 py-0.5 mt-0.5 rounded-sm">
<span class="text-[6px] font-bold text-blue-900 uppercase">Gold Partner</span>
</div>
</div>
</div>
</footer>
<!-- END: FooterBranding -->
</body></html>
