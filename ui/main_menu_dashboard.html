<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Stock Count Dashboard</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-branding">
    /* Custom brand color to match the deep red in the UI */
    .bg-brand-red {
      background-color: #990000;
    }
    .text-brand-red {
      color: #990000;
    }
    .border-brand-gray {
      border-color: #d1d5db;
    }
    /* Specific shadow for the dashboard cards */
    .card-shadow {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen font-sans">
<!-- BEGIN: TopHeader -->
<header class="bg-brand-red text-white px-4 py-3 flex items-center justify-between sticky top-0 z-50">
<!-- Brand Title and Logo Placeholder -->
<div class="flex items-center gap-2">
<span class="text-xl font-bold tracking-tight">Stock</span>
<div class="bg-white text-brand-red rounded p-0.5">
<svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xl font-bold tracking-tight">Count</span>
</div>
<!-- Header Actions -->
<div class="flex items-center space-x-5">
<!-- Question Mark Icon -->
<button aria-label="Help" data-purpose="help-action">
<svg class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Share Icon -->
<button aria-label="Share" data-purpose="share-action">
<svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- More Options Icon -->
<button aria-label="More Options" data-purpose="more-action">
<svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</header>
<!-- END: TopHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-grow container mx-auto px-6 py-8">
<!-- Dashboard Grid -->
<div class="grid grid-cols-2 gap-4" id="dashboard-menu">
<!-- Setting Card -->
<div class="bg-white border border-gray-300 rounded-md p-6 flex flex-col items-center justify-center card-shadow aspect-square cursor-pointer active:bg-gray-100 transition-colors" data-purpose="menu-item-setting">
<div class="mb-4">
<!-- Icon placeholder for Mobile with Gear -->
<svg fill="none" height="90" viewBox="0 0 60 90" width="60" xmlns="http://www.w3.org/2000/svg">
<rect height="90" rx="6" stroke="#4b5563" stroke-width="3" width="50" x="5" y="0"></rect>
<circle cx="30" cy="80" fill="#4b5563" r="2.5"></circle>
<circle cx="45" cy="40" fill="white" r="18" stroke="#4b5563" stroke-width="2"></circle>
<path d="M45 28L47 30M45 52L43 50M33 40L35 42M57 40L55 38" stroke="#ef4444" stroke-width="3"></path>
<circle cx="45" cy="40" fill="#ef4444" r="10"></circle>
<path d="M45 34L45 46M39 40L51 40" stroke="white" stroke-width="2"></path>
</svg>
</div>
<span class="text-gray-700 font-semibold text-lg">Setting</span>
</div>
<!-- Master Data Card -->
<div class="bg-white border border-gray-300 rounded-md p-6 flex flex-col items-center justify-center card-shadow aspect-square cursor-pointer active:bg-gray-100 transition-colors" data-purpose="menu-item-master-data">
<div class="mb-4">
<!-- Icon placeholder for Folder and Files -->
<svg fill="none" height="60" viewBox="0 0 80 60" width="80" xmlns="http://www.w3.org/2000/svg">
<path d="M5 10H30L35 15H75V55H5V10Z" fill="#4b5563"></path>
<rect fill="white" height="40" stroke="#4b5563" stroke-width="1" width="40" x="15" y="0"></rect>
<line stroke="#ef4444" stroke-width="2" x1="20" x2="50" y1="10" y2="10"></line>
<line stroke="#ef4444" stroke-width="2" x1="20" x2="50" y1="18" y2="18"></line>
<line stroke="#4b5563" stroke-width="2" x1="20" x2="40" y1="26" y2="26"></line>
</svg>
</div>
<span class="text-gray-700 font-semibold text-lg">Master Data</span>
</div>
<!-- Start Counting Card -->
<div class="bg-white border border-gray-300 rounded-md p-6 flex flex-col items-center justify-center card-shadow aspect-square cursor-pointer active:bg-gray-100 transition-colors" data-purpose="menu-item-start-counting">
<div class="mb-4">
<!-- Icon placeholder for Scanner -->
<svg fill="none" height="70" viewBox="0 0 80 70" width="80" xmlns="http://www.w3.org/2000/svg">
<path d="M45 5C55 5 60 7 60 12V25L50 35H30L20 25V12C20 7 25 5 35 5H45Z" fill="white" stroke="#4b5563" stroke-width="2"></path>
<path d="M30 35L35 65H55L60 35" fill="white" stroke="#4b5563" stroke-width="2"></path>
<rect fill="#ef4444" height="10" width="30" x="25" y="10"></rect>
<path d="M10 25C15 20 20 22 25 25" opacity="0.5" stroke="#ef4444" stroke-width="1"></path>
<path d="M5 30C12 22 18 25 25 30" opacity="0.3" stroke="#ef4444" stroke-width="1"></path>
</svg>
</div>
<span class="text-gray-700 font-semibold text-lg">Start Counting</span>
</div>
<!-- View Result Card -->
<div class="bg-white border border-gray-300 rounded-md p-6 flex flex-col items-center justify-center card-shadow aspect-square cursor-pointer active:bg-gray-100 transition-colors" data-purpose="menu-item-view-result">
<div class="mb-4">
<!-- Icon placeholder for Clipboard -->
<svg fill="none" height="75" viewBox="0 0 60 75" width="60" xmlns="http://www.w3.org/2000/svg">
<rect fill="white" height="60" rx="2" stroke="#4b5563" stroke-width="3" width="50" x="5" y="10"></rect>
<rect fill="#4b5563" height="8" rx="2" width="20" x="20" y="5"></rect>
<line stroke="#9ca3af" stroke-width="2" x1="15" x2="45" y1="25" y2="25"></line>
<line stroke="#9ca3af" stroke-width="2" x1="15" x2="45" y1="35" y2="35"></line>
<line stroke="#9ca3af" stroke-width="2" x1="15" x2="45" y1="45" y2="45"></line>
<line stroke="#9ca3af" stroke-width="2" x1="15" x2="35" y1="55" y2="55"></line>
<circle cx="50" cy="20" fill="#ef4444" r="8"></circle>
<path d="M47 20L49 22L53 18" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="text-gray-700 font-semibold text-lg">View Result</span>
</div>
</div>
<!-- Exit Button Area -->
<div class="mt-12 flex justify-center">
<button class="bg-brand-red text-white font-bold py-3 px-12 rounded shadow-md active:opacity-90 active:scale-95 transition-all text-lg tracking-wide" data-purpose="exit-application">
        EXIT
      </button>
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: Footer -->
<footer class="bg-white border-t border-gray-200 py-3 px-4">
<div class="flex items-center justify-center space-x-3">
<span class="text-xs text-gray-500 font-medium">powered by :</span>
<!-- STEM Logo Placeholder -->
<div class="flex items-center" data-purpose="stem-branding">
<span class="text-blue-900 font-black text-xl italic tracking-tighter">STEM</span>
<div class="h-4 w-px bg-gray-300 mx-2"></div>
<div class="flex flex-col text-[8px] leading-none text-blue-800 font-bold">
<span>INNOVATION</span>
<span>DESIGN</span>
<span>VALUE</span>
</div>
</div>
<!-- SAP Partner Badge Placeholder -->
<div class="flex flex-col items-center bg-gray-100 border border-yellow-400 p-1 rounded" data-purpose="sap-partner-branding">
<span class="text-blue-600 font-bold text-xs leading-none">SAP</span>
<div class="w-full h-1 bg-yellow-400 my-0.5"></div>
<span class="text-[6px] font-bold text-gray-700 uppercase">Gold Partner</span>
</div>
</div>
</footer>
<!-- END: Footer -->
</body></html>
