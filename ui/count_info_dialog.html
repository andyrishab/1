<input class="flex-grow input-underline text-white text-sm focus:ring-0" id="location" type="text">
</div>
<!-- OK Button Container -->
<div class="pt-4 flex justify-center">
<button class="bg-app-red text-white font-bold py-2 px-10 rounded shadow hover:bg-red-800 transition-colors uppercase text-sm" type="button">
