<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Start Counting - Industrial Precision Management</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#b71c1c',
              dark: '#8e1616',
            },
            surface: {
              DEFAULT: '#fcf9f8',
              dim: '#dcd9d9',
              bright: '#fcf9f8',
              container: '#f6f3f2',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          borderRadius: {
            'custom': '8px',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-styling">
    body {
      background-color: #ffffff;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Mimicking the red status bar/header area */
    .status-bar-bg {
      background-color: #b71c1c;
    }
    /* Scanner overlay line animation */
    .scanner-line {
      height: 2px;
      background-color: red;
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
    }
    .scanner-dot {
      width: 6px;
      height: 6px;
      background-color: #fbbf24;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- BEGIN: MainHeader -->
<header class="brand-bg bg-brand text-white flex flex-col pt-2 pb-3 shadow-md" data-purpose="app-header">
<!-- Top System Bar Mock -->
<div class="flex justify-between items-center px-6 py-1 text-xs font-semibold">
<span>8:25 <i class="ml-1 opacity-80">₪</i></span>
<div class="bg-[#00c853] px-3 py-0.5 rounded-full flex items-center">
<svg class="w-3 h-3" fill="currentColor" viewbox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>
</div>
</div>
<!-- Title and Actions -->
<div class="flex items-center justify-between px-4 mt-2">
<button aria-label="Go Back" class="p-2">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<div class="flex items-center gap-2">
<span class="text-xl font-bold tracking-tight">Start</span>
<div class="bg-white p-0.5 rounded">
<svg class="w-6 h-6 text-brand" fill="currentColor" viewbox="0 0 24 24">
<path d="M21 16.5c0 .38-.21.71-.53.88l-7.9 4.44c-.16.09-.36.14-.57.14s-.41-.05-.57-.14l-7.9-4.44c-.31-.17-.53-.5-.53-.88v-9c0-.38.21-.71.53-.88l7.9-4.44c.16-.09.36-.14.57-.14s.41.05.57.14l7.9 4.44c.31.17.53.5.53.88v9zM12 4.15L6.04 7.5 12 10.85l5.96-3.35L12 4.15zM5 15.91l6 3.38v-6.71L5 9.21v6.7zm14 0v-6.7l-6 3.37v6.71l6-3.38z"></path>
</svg>
</div>
<span class="text-xl font-bold tracking-tight">Counting</span>
</div>
<button aria-label="Barcode Scanner Settings" class="p-2">
<svg class="w-7 h-7" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4v1m-3.3 1.3l-.7-.7m0 10.8l.7-.7M4 12h1m10.8 3.3l.7.7M12 19v1m3.3-1.3l.7.7M20 12h-1m-10.8-3.3l-.7-.7M9 9h6v6H9V9z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-grow flex flex-col bg-white" data-purpose="counting-interface">
<!-- ID Display -->
<div class="px-4 py-2 bg-white text-gray-500 text-xs font-medium">
      #PI20260730003
    </div>
<!-- Scanner Section -->
<div class="relative px-4" data-purpose="scanner-viewport">
<div class="relative aspect-[4/3] bg-gray-900 overflow-hidden rounded shadow-inner">
<!-- Mock Camera Image -->
<img alt="Camera View" class="w-full h-full object-cover opacity-60" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxwj_gsm7klDNUsFJy0Me7FVV6LrBIkenmQUGw-mMPAV0gRmsaGxoUVjQwinc2KNuKZTi_7efVHgZPFCkqnB1f6JXdiVd3d9NN-qczWkEyuQLPwW1YnSbjyPDAqGb4xXm7FmcA4fglaCPRP-__Qdp4qMZyLKFBPKC5DjX4SLOG3BoZNko610gfQ2W4lI-iS2VB1fUaEAw2BeEbI3MdMINTk_a8yEZdPWqOdMeIxV7k4psTJZ1vVWTZD_2LShJAh4DSaQ"/>
<!-- Scanned Area Frame -->
<div class="absolute inset-4 border border-white/20">
<!-- Active Scanning Indicator -->
<div class="scanner-line"></div>
<div class="scanner-dot"></div>
<!-- Flash/Light Toggle -->
<button aria-label="Toggle Flash" class="absolute top-2 right-2 text-white/80 p-2">
<svg class="w-6 h-6" fill="currentColor" viewbox="0 0 24 24">
<path d="M7 2v11h3v9l7-12h-4l4-8H7z"></path>
</svg>
</button>
</div>
</div>
<div class="w-full h-1 bg-brand/20 mt-1"></div>
</div>
<!-- Controls Section -->
<div class="px-4 py-4 flex items-center justify-between" data-purpose="counting-controls">
<!-- Search/Input Icon -->
<button aria-label="Search/Manual Input" class="text-brand p-2">
<svg class="w-8 h-8" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Status/Total Display -->
<div class="flex items-center gap-2 text-brand font-semibold text-lg">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"></path>
</svg>
<span>Total : 0 (0)</span>
</div>
</div>
<!-- Empty/Results Area -->
<div class="flex-grow flex items-center justify-center">
<!-- Content would dynamically appear here -->
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: Footer -->
<footer class="border-t border-gray-200 bg-surface px-4 py-3" data-purpose="app-footer">
<div class="flex items-center justify-center gap-2">
<span class="text-xs text-brand/80 italic font-medium">powered by :</span>
<!-- STEM Logo Mockup -->
<div class="flex items-center gap-1">
<div class="flex flex-col items-center">
<span class="text-[#0d47a1] font-bold text-xl leading-none">STEM</span>
<span class="text-[6px] uppercase tracking-tighter text-[#0d47a1]">Innovation • Design • Value</span>
</div>
<div class="h-8 w-px bg-gray-300 mx-1"></div>
<!-- SAP Logo Mockup -->
<div class="flex flex-col">
<div class="bg-[#008fd3] text-white px-2 py-0.5 rounded-sm flex items-center">
<span class="font-bold italic text-sm">SAP</span>
<span class="text-[8px] ml-1 self-end mb-0.5">®</span>
</div>
<span class="text-[7px] font-bold text-gray-500 text-center">Gold Partner</span>
</div>
</div>
</div>
</footer>
<!-- END: Footer -->
</body></html>
