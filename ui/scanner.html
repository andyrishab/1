<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Scanner - InventoryFlow</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=JetBrains+Mono:wght@100..900&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scan-line {
            animation: scan 3s ease-in-out infinite;
        }
        @keyframes scan {
            0%, 100% { transform: translateY(0); opacity: 0.2; }
            50% { transform: translateY(100%); opacity: 1; }
        }
        .bottom-sheet {
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1);
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>

                        "tertiary-container": "#5c5d5d",
                        "on-background": "#1b1c1c",
                        "surface": "#fcf9f8",
                        "on-surface": "#1b1c1c",
                        "on-secondary-container": "#616363",
                        "on-tertiary-fixed": "#1a1c1c",
                        "secondary-fixed-dim": "#c6c6c7",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",

                        "lg": "0.5rem",

                        "md": "16px",

<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden">
<!-- Top Navigation Bar -->
<header class="bg-surface border-b border-surface-variant flex justify-between items-center w-full px-edge_margin h-16 fixed top-0 z-50">
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-primary">menu</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">InventoryFlow</h1>
</div>
<div class="flex items-center gap-2">
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-primary">search</span>
</button>
</div>
</header>
<!-- Main Content: Scanner Viewport -->
<main class="pt-16 pb-20 min-h-screen relative flex flex-col items-center justify-center bg-black overflow-hidden">
<!-- Camera Preview Simulation -->
<div class="absolute inset-0 w-full h-full bg-slate-900 overflow-hidden">
<div class="w-full h-full bg-cover bg-center opacity-70 grayscale" data-alt="A first-person view of a high-tech warehouse aisle with industrial shelving units and rows of neatly stacked cardboard boxes. The lighting is bright and even, typical of a modern logistics facility. The image is captured with a shallow depth of field, emphasizing the foreground boxes while the background shelves fade into soft bokeh. The overall aesthetic is professional, clean, and dominated by light grays and whites, with a hint of industrial grit." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAifcJ2LNDs0Zoq87_u-gybh8EyBc0v7QBfij-vVdf95koIUT07YIRpfToP2XwiWu-E4qdW4zh1KRRruQWeU-KM8vqhSaqtyVcl2y7L_jpLbkcF4BUcUG5V-f7sONDz9MonRL8u2gdx7isihbeNvd7G8ncle9BpSYvH69DF6coeeqc18k9czkOvbQEOegKKOCp_eCF94GUIBAQlEUVXln-_itLwrlhTOOIu5sKngjVy3dC57HUnVhc2')"></div>
<!-- Scanning Overlay UI -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="relative w-72 h-72 border-2 border-white/20 rounded-xl overflow-hidden shadow-2xl">
<!-- Corner Markers -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
<!-- Animated Scan Line -->
<div class="scan-line absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary to-transparent shadow-[0_0_15px_rgba(145,0,10,0.8)]"></div>
</div>
</div>
</div>
<!-- Scanner Controls (Floating) -->
<div class="absolute top-24 right-4 flex flex-col gap-4 z-20">
<button class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/20 flex items-center justify-center text-white active:scale-90 transition-transform hover:bg-black/60">
<span class="material-symbols-outlined">flash_on</span>
</button>
<button class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/20 flex items-center justify-center text-white active:scale-90 transition-transform hover:bg-black/60">
<span class="material-symbols-outlined">flip_camera_ios</span>
</button>
<button class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/20 flex items-center justify-center text-white active:scale-90 transition-transform hover:bg-black/60">
<span class="material-symbols-outlined">edit</span>
</button>
</div>
<!-- Scanning Status Hint -->
<div class="absolute top-24 left-1/2 -translate-x-1/2 bg-black/50 backdrop-blur-md px-4 py-2 rounded-full text-white font-label-md text-label-md border border-white/10">
            ALIGN BARCODE WITHIN FRAME
        </div>
</main>
<!-- Bottom Sheet: Product Preview -->
<div class="bottom-sheet fixed bottom-20 left-0 right-0 z-40 bg-surface rounded-t-xl shadow-[0_-8px_24px_rgba(0,0,0,0.12)] border-t border-surface-variant flex flex-col pb-safe" id="bottomSheet">
<div class="flex flex-col p-4 gap-4">
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-surface-variant rounded-full mx-auto mb-2"></div>
<div class="flex gap-4">
<!-- Product Thumbnail -->
<div class="w-24 h-24 rounded-lg bg-surface-container overflow-hidden border border-surface-variant flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="A clean, professional product studio shot of a high-end logistics sensor module on a pure white background. The device is sleek, with a matte metallic finish and subtle branding. Lighting is soft and directional to highlight its premium build quality. The overall aesthetic is minimalist and high-tech, fitting for a modern enterprise inventory application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDKTLob1cM_T3igF43wbhWkWz05M925m16lGhE-N2c4EK9YUTDvXvaw00zWgxg-2aChNadaTHCkYY7DE1k2VJ-DDrjpbc74Qd91b9ARL3RfO9PkwQRRaGnGQQZm3O2fDrujD24LoSTeyewP9TYGtngyilzB9pLI0zk0fwyjMnb497cXdridmoHYy1WJx3dd22cygbtjeZDLEnwYcpTp1JLfRx5Og_QuhurvwGypn5tJbgbfSFPcNwtg">
</div>
<!-- Product Details -->
<div class="flex flex-col justify-center flex-grow">
<span class="bg-primary/10 text-primary px-2 py-0.5 rounded-full text-[10px] font-bold w-fit mb-1 tracking-wider">DETECTED</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Precision Sensor X-100</h2>
<p class="font-label-md text-label-md text-on-surface-variant">SKU: SNS-2024-XP01</p>
<div class="flex items-center gap-1 mt-1 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">qr_code_2</span>
<span class="font-label-md text-label-md">8801234567890</span>
</div>
</div>
</div>
<div class="h-px bg-surface-variant w-full"></div>
<!-- Counter Section -->
<div class="flex items-center justify-between py-2">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1">COUNT QUANTITY</label>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant">inventory_2</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Stock Count</span>
</div>
</div>
<div class="flex items-center bg-surface-container-high rounded-full p-1 border border-surface-variant">
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-variant active:scale-90 transition-transform" id="decrement">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="w-16 bg-transparent border-none text-center font-label-md text-headline-sm focus:ring-0 p-0 text-primary" id="quantity" min="1" type="number" value="1">
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-variant active:scale-90 transition-transform" id="increment">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<!-- Save Button -->
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-button text-button shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2 mt-2">
<span class="material-symbols-outlined">save</span>
                SAVE COUNT
            </button>
</div>
</div>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full h-20 flex justify-around items-center px-4 pb-2 bg-surface-container-lowest border-t border-surface-variant shadow-md z-50">
<a class="flex flex-col items-center justify-center text-on-surface-variant py-1 hover:bg-surface-variant transition-colors rounded-lg px-4" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-6 py-1 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<span class="font-label-md text-label-md">Scanner</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant py-1 hover:bg-surface-variant transition-colors rounded-lg px-4" href="#">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-label-md text-label-md">Products</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant py-1 hover:bg-surface-variant transition-colors rounded-lg px-4" href="#">
<span class="material-symbols-outlined">analytics</span>
<span class="font-label-md text-label-md">Reports</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant py-1 hover:bg-surface-variant transition-colors rounded-lg px-4" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</a>
</nav>
<script>
        // Simple Interaction Logic
        const quantityInput = document.getElementById('quantity');
        const incrementBtn = document.getElementById('increment');
        const decrementBtn = document.getElementById('decrement');

        incrementBtn.addEventListener('click', () => {
            quantityInput.value = parseInt(quantityInput.value) + 1;
        });

        decrementBtn.addEventListener('click', () => {
            if (parseInt(quantityInput.value) > 1) {
                quantityInput.value = parseInt(quantityInput.value) - 1;
            }
        });

        // Flash Button Toggle Mock
        const flashBtn = document.querySelector('button span[data-icon="flash_on"]');
        let flashOn = false;
        document.querySelectorAll('button').forEach(btn => {
            if (btn.innerText.includes('flash_on')) {
                btn.addEventListener('click', () => {
                    flashOn = !flashOn;
                    btn.classList.toggle('bg-primary', flashOn);
                    btn.classList.toggle('text-white', flashOn);
                    btn.innerHTML = `<span class="material-symbols-outlined">${flashOn ? 'flash_off' : 'flash_on'}</span>`;
                });
            }
        });

        // Prevent overflow scrolling on main body for that "app" feel
        document.body.addEventListener('touchmove', function(e) {
            if (e.target.closest('#bottomSheet')) return;
            e.preventDefault();
        }, { passive: false });
    </script>
</body></html>
