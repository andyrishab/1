<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Menu Setting</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-colors">
    /* Custom red color matching the header in the screenshot */
    .bg-app-red {
      background-color: #b31010;
    }
    .text-app-red {
      color: #b31010;
    }
    /* Custom border and checkbox colors */
    .border-gray-light {
      border-color: #e5e7eb;
    }
  </style>
<style data-purpose="typography">
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-white flex flex-col min-h-screen">
<!-- BEGIN: MainHeader -->
<header class="bg-app-red text-white flex items-center px-4 py-4 sticky top-0 z-10 shadow-md">
<!-- Back Button -->
<button aria-label="Go back" class="mr-6 focus:outline-none">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Title and Icon -->
<div class="flex items-center space-x-2">
<span class="text-xl font-bold">Menu</span>
<div class="w-8 h-8 flex items-center justify-center">
<!-- Cube icon placeholder -->
<svg class="w-6 h-6" fill="white" viewBox="0 0 24 24">
<path d="M21 16.5c0 .38-.21.71-.53.88l-7.9s-.2.12-.57.12c-.37 0-.57-.12-.57-.12l-7.9-4.5c-.32-.17-.53-.5-.53-.88V7.5c0-.38.21-.71.53-.88l7.9-4.5s.2-.12.57-.12c.37 0 .57.12.57.12l7.9 4.5c.32.17.53.5.53.88v9zM12 4.15L6.04 7.5 12 10.85l5.96-3.35L12 4.15zM5 15.91l6 3.42v-6.69l-6-3.41v6.68zm8 3.42l6-3.42V9.23l-6 3.41v6.69z"></path>
</svg>
</div>
<span class="text-xl font-bold">Setting</span>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: SettingsList -->
<main class="flex-grow">
<!-- Section Heading -->
<div class="px-4 py-3 bg-white">
<h2 class="text-app-red font-medium">General</h2>
</div>
<!-- Settings Items -->
<div class="divide-y divide-gray-200 border-t border-gray-200">
<!-- Quantity Decimal Digit -->
<div class="px-4 py-4 active:bg-gray-50 cursor-pointer" data-purpose="setting-item">
<h3 class="text-gray-800 text-lg">Quantity Decimal Digit</h3>
<p class="text-gray-500 text-sm">Number of decimal digit used on quantity (0)</p>
</div>
<!-- Selling Price Decimal Digit -->
<div class="px-4 py-4 active:bg-gray-50 cursor-pointer" data-purpose="setting-item">
<h3 class="text-gray-800 text-lg">Selling Price Decimal Digit</h3>
<p class="text-gray-500 text-sm">Number of decimal digit used on selling price (0)</p>
</div>
<!-- Show Selling Price (Checked) -->
<label class="px-4 py-4 flex items-start justify-between active:bg-gray-50 cursor-pointer" data-purpose="setting-item">
<div class="flex-grow pr-4">
<h3 class="text-gray-800 text-lg">Show Selling Price</h3>
<p class="text-gray-500 text-sm">Show Selling Price in screen Start Counting and Master Data</p>
</div>
<div class="mt-1">
<input checked="" class="h-6 w-6 text-app-red rounded border-gray-300 focus:ring-0" type="checkbox">
</div>
</label>
<!-- Use Purchase Price / Cost (Unchecked) -->
<label class="px-4 py-4 flex items-start justify-between active:bg-gray-50 cursor-pointer" data-purpose="setting-item">
<div class="flex-grow pr-4">
<h3 class="text-gray-800 text-lg">Use Purchase Price / Cost</h3>
<p class="text-gray-500 text-sm">Use Purchase Price / Cost in screen Start Counting (Edit) and Share Result</p>
</div>
<div class="mt-1">
<input class="h-6 w-6 text-app-red rounded border-gray-300 focus:ring-0" type="checkbox">
</div>
</label>
<!-- Export to IREAP PRO (Unchecked) -->
<label class="px-4 py-4 flex items-start justify-between active:bg-gray-50 cursor-pointer border-b border-gray-200" data-purpose="setting-item">
<div class="flex-grow pr-4">
<div class="flex items-center">
<h3 class="text-gray-800 text-lg">Export to IREAP PRO</h3>
<span class="ml-2">
<!-- Mini icon placeholder for IREAP PRO -->
<img alt="iREAP Logo" class="w-5 h-5 rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA9QYKjAMx8v1BlqfgctZoZPpoQqZYAo2LGWkR4MjPTzAZbk7Fz79FpFO1Vy5nCButYyOTXj3pHtzytzvSOXTr8PB6lhEaN_65YpytxYNMB3daptDKngDSaD4Gs7zkjtGHLX621oLvMsff2OBkn08Pj70m9IwRBfmGVC6M2AZB6tZBFjpJl0kt2DWrxnaTUbyCWn-riniApxQ2DkXMfmd-Y4SzT6mx3nnrDNfducUD6722XQ2aXt1Z1">
</span>
</div>
<p class="text-gray-500 text-sm">Visit www.ireappos.com to explore iREAP PRO (POS application)</p>
</div>
<div class="mt-1">
<input class="h-6 w-6 text-app-red rounded border-gray-300 focus:ring-0" type="checkbox">
</div>
</label>
</div>
</main>
<!-- END: SettingsList -->
<!-- BEGIN: Footer -->
<footer class="bg-white border-t border-gray-300 py-3 px-4">
<div class="flex items-center justify-center space-x-2">
<span class="text-app-red text-sm font-medium">powered by :</span>
<!-- STEM Logo -->
